<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sales Sheet Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Public+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f5f4ef;
    --ink: #191d26;
    --green: #0f7b5f;
    --amber: #e0a83c;
    --muted: #7a7f89;
    --stripe: #edece5;
    --line: #d8d6cc;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Public Sans", system-ui, sans-serif;
    min-height: 100vh;
    padding: 48px 24px 96px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { margin-bottom: 40px; }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 8px;
  }
  h1 {
    font-family: "Archivo", sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 5vw, 46px);
    letter-spacing: -0.02em;
    line-height: 1.05;
  }
  .sub { color: var(--muted); margin-top: 10px; max-width: 52ch; }

  /* ---- Receipt drop zone (signature element) ---- */
  .receipt {
    background: #fffdf8;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    position: relative;
    padding: 44px 32px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s ease;
    box-shadow: 0 10px 24px rgba(25, 29, 38, 0.07);
  }
  /* perforated top and bottom edges */
  .receipt::before, .receipt::after {
    content: "";
    position: absolute; left: 0; right: 0; height: 12px;
    background:
      linear-gradient(45deg, transparent 33.33%, #fffdf8 33.33%, #fffdf8 66.66%, transparent 66.66%),
      linear-gradient(-45deg, transparent 33.33%, #fffdf8 33.33%, #fffdf8 66.66%, transparent 66.66%);
    background-size: 16px 24px;
  }
  .receipt::before { top: -12px; transform: scaleY(-1); }
  .receipt::after { bottom: -12px; }

  .receipt.dragover { background: #f2fbf7; }
  .receipt.dragover .drop-label { color: var(--green); }

  .drop-icon {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 14px;
  }
  .drop-label {
    font-family: "Archivo", sans-serif;
    font-weight: 800;
    font-size: 22px;
  }
  .drop-hint {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
  }
  .drop-hint u { text-decoration-color: var(--green); text-underline-offset: 3px; }
  input[type="file"] { display: none; }

  /* ---- Receipt summary line-items ---- */
  .summary {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    text-align: left;
    max-width: 420px;
    margin: 0 auto;
  }
  .summary .li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 0;
  }
  .summary .li .dots {
    flex: 1;
    border-bottom: 2px dotted var(--line);
  }
  .summary .li .val { font-weight: 600; }
  .summary .total {
    border-top: 1px solid var(--ink);
    margin-top: 8px; padding-top: 8px;
    color: var(--green);
  }
  .reset-btn {
    margin-top: 20px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    background: none;
    border: 1px solid var(--line);
    padding: 8px 16px;
    cursor: pointer;
    color: var(--muted);
  }
  .reset-btn:hover { border-color: var(--ink); color: var(--ink); }

  .status {
    margin: 24px 0 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    min-height: 20px;
  }
  .status.error { color: #b3403a; }

  /* ---- Analytics panel ---- */
  .analytics { margin-top: 48px; }
  .analytics h2 {
    font-family: "Archivo", sans-serif;
    font-weight: 800;
    font-size: 20px;
    margin-bottom: 4px;
  }
  .analytics .cap {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px; color: var(--muted);
    margin-bottom: 18px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .card {
    background: #fffdf8;
    border: 1px solid var(--line);
    border-top: 3px solid var(--green);
    padding: 16px 18px;
  }
  .card .k {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  .card .v {
    font-family: "Archivo", sans-serif;
    font-weight: 800; font-size: 26px;
    margin-top: 6px; letter-spacing: -0.01em;
  }
  .card .v.pos { color: var(--green); }
  .card.assume { border-top-color: var(--amber); }
  .card.assume .row { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; }
  .card.assume input {
    width: 56px; font-family: "IBM Plex Mono", monospace;
    font-size: 18px; border: none; border-bottom: 2px solid var(--amber);
    background: transparent; color: var(--ink); padding: 2px 0;
  }
  .card.assume input:focus { outline: none; }
  .card.assume .hint { font-size: 11px; color: var(--muted); margin-top: 8px; }

  .panel {
    background: #fffdf8;
    border: 1px solid var(--line);
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  .panel h3 {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px; font-weight: 600;
  }
  /* horizontal bar rows for monthly trend / breakdowns */
  .bar-row { display: grid; grid-template-columns: 92px 1fr 120px; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar-row .label { font-family: "IBM Plex Mono", monospace; font-size: 13px; }
  .bar-track { background: var(--stripe); height: 22px; position: relative; }
  .bar-fill { background: var(--green); height: 100%; }
  .bar-fill.amber { background: var(--amber); }
  .bar-row .amt { font-family: "IBM Plex Mono", monospace; font-size: 13px; text-align: right; font-weight: 600; }
  .breakdowns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .breakdowns { grid-template-columns: 1fr; } }
  .status-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    border: 1px solid var(--line); padding: 6px 12px;
  }
  .chip b { color: var(--ink); }

  /* ---- Sheet tabs + table ---- */
  .results { margin-top: 56px; display: none; }
  .results.show { display: block; }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 0; }
  .tab {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    padding: 10px 18px;
    border: 1px solid var(--line);
    border-bottom: none;
    background: var(--stripe);
    color: var(--muted);
    cursor: pointer;
  }
  .tab.active {
    background: #fffdf8;
    color: var(--ink);
    font-weight: 600;
    border-top: 3px solid var(--green);
  }
  .tab:focus-visible, .receipt:focus-visible, .reset-btn:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }

  .table-shell {
    border: 1px solid var(--line);
    background: #fffdf8;
    overflow-x: auto;
    max-height: 70vh;
    overflow-y: auto;
  }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  thead th {
    position: sticky; top: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-align: left;
    padding: 10px 14px;
    white-space: nowrap;
  }
  tbody td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--stripe);
    white-space: nowrap;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  tbody td.num { font-family: "IBM Plex Mono", monospace; text-align: right; }
  tbody tr:nth-child(even) { background: var(--stripe); }

  .table-meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }
  .table-meta .amber { color: var(--amber); }

  @media (prefers-reduced-motion: reduce) {
    .receipt { transition: none; }
  }
  @media (max-width: 600px) {
    body { padding: 32px 14px 64px; }
    .receipt { padding: 32px 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Internal tool · No. 001</div>
    <h1>Sales Sheet Viewer</h1>
    <p class="sub">Drop an e-commerce sales export below. The file is parsed on your server and shown here — nothing is stored.</p>
  </header>

  <div class="receipt" id="dropzone" role="button" tabindex="0" aria-label="Upload a spreadsheet">
    <div id="drop-idle">
      <div class="drop-icon">*** RECEIPT ***</div>
      <div class="drop-label">Drop your sales file here</div>
      <div class="drop-hint">or <u>click to browse</u> — .xlsx, .xls, .csv · up to 20&nbsp;MB</div>
    </div>
    <div id="drop-done" style="display:none">
      <div class="drop-icon">*** PARSED OK ***</div>
      <div class="summary" id="summary"></div>
      <button class="reset-btn" id="resetBtn" type="button">Load another file</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
  <p class="status" id="status"></p>

  <section class="results" id="results">
    <div class="analytics" id="analytics"></div>
    <div class="tabs" id="tabs"></div>
    <div class="table-shell" id="tableShell"></div>
    <p class="table-meta" id="tableMeta"></p>
  </section>
</div>

<script>
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const statusEl = document.getElementById("status");
  const results = document.getElementById("results");
  const tabsEl = document.getElementById("tabs");
  const tableShell = document.getElementById("tableShell");
  const tableMeta = document.getElementById("tableMeta");
  const dropIdle = document.getElementById("drop-idle");
  const dropDone = document.getElementById("drop-done");
  const summaryEl = document.getElementById("summary");
  const resetBtn = document.getElementById("resetBtn");
  const analyticsEl = document.getElementById("analytics");

  let currentData = null;
  let currentSheetIndex = 0;
  let assumedMargin = 30; // % — used for profit when no cost column exists

  // --- Drag & drop wiring ---
  ["dragenter", "dragover"].forEach((ev) =>
    dropzone.addEventListener(ev, (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    })
  );
  ["dragleave", "drop"].forEach((ev) =>
    dropzone.addEventListener(ev, (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
    })
  );
  dropzone.addEventListener("drop", (e) => {
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });
  dropzone.addEventListener("click", (e) => {
    if (e.target.id !== "resetBtn" && !currentData) fileInput.click();
  });
  dropzone.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && !currentData) {
      e.preventDefault();
      fileInput.click();
    }
  });
  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) uploadFile(fileInput.files[0]);
  });
  resetBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    currentData = null;
    fileInput.value = "";
    dropDone.style.display = "none";
    dropIdle.style.display = "";
    results.classList.remove("show");
    statusEl.textContent = "";
    statusEl.classList.remove("error");
  });

  // --- Upload + render ---
  async function uploadFile(file) {
    statusEl.classList.remove("error");
    statusEl.textContent = "Uploading and parsing " + file.name + " …";

    const form = new FormData();
    form.append("file", file);

    try {
      const res = await fetch("/api/upload", { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Upload failed.");

      currentData = data;
      statusEl.textContent = "";
      renderSummary(data);
      renderTabs(data);
      renderSheet(0);
      results.classList.add("show");
    } catch (err) {
      statusEl.classList.add("error");
      statusEl.textContent = err.message;
    }
  }

  function renderSummary(data) {
    const totalRows = data.sheets.reduce((s, sh) => s + sh.rowCount, 0);
    const kb = (data.sizeBytes / 1024).toFixed(1);
    summaryEl.innerHTML =
      lineItem("FILE", escapeHtml(data.filename)) +
      lineItem("SIZE", kb + " KB") +
      lineItem("SHEETS", data.sheets.length) +
      '<div class="li total"><span>TOTAL ROWS</span><span class="dots"></span><span class="val">' +
      totalRows.toLocaleString() + "</span></div>";
    dropIdle.style.display = "none";
    dropDone.style.display = "";
  }

  function lineItem(k, v) {
    return '<div class="li"><span>' + k + '</span><span class="dots"></span><span class="val">' + v + "</span></div>";
  }

  function renderTabs(data) {
    tabsEl.innerHTML = "";
    data.sheets.forEach((sheet, i) => {
      const b = document.createElement("button");
      b.className = "tab" + (i === 0 ? " active" : "");
      b.textContent = sheet.name + " (" + sheet.rowCount.toLocaleString() + ")";
      b.addEventListener("click", () => {
        tabsEl.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        b.classList.add("active");
        renderSheet(i);
      });
      tabsEl.appendChild(b);
    });
  }

  function renderSheet(index) {
    currentSheetIndex = index;
    renderAnalytics(currentData.sheets[index].analytics);
    const sheet = currentData.sheets[index];
    if (!sheet.headers.length && !sheet.rows.length) {
      tableShell.innerHTML = '<p style="padding:24px;color:var(--muted)">This sheet is empty.</p>';
      tableMeta.textContent = "";
      return;
    }

    const colCount = Math.max(sheet.headers.length, ...sheet.rows.map((r) => r.length), 0);
    let html = "<table><thead><tr>";
    for (let c = 0; c < colCount; c++) {
      html += "<th>" + escapeHtml(sheet.headers[c] ?? "Col " + (c + 1)) + "</th>";
    }
    html += "</tr></thead><tbody>";
    sheet.rows.forEach((row) => {
      html += "<tr>";
      for (let c = 0; c < colCount; c++) {
        const cell = row[c] ?? "";
        const isNum = typeof cell === "number";
        html += '<td class="' + (isNum ? "num" : "") + '">' +
          escapeHtml(isNum ? cell.toLocaleString() : String(cell)) + "</td>";
      }
      html += "</tr>";
    });
    html += "</tbody></table>";
    tableShell.innerHTML = html;

    const shown = sheet.rows.length;
    tableMeta.innerHTML = shown < sheet.rowCount
      ? 'Showing first ' + shown.toLocaleString() + ' of ' + sheet.rowCount.toLocaleString() +
        ' rows <span class="amber">· display capped at 1,000</span>'
      : shown.toLocaleString() + " rows";
  }

  // ---- Analytics rendering ----
  const money = (n) =>
    n == null ? "—" : "$" + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = (n) => (n == null ? "—" : n.toLocaleString());

  function renderAnalytics(a) {
    if (!a || !a.totals) { analyticsEl.innerHTML = ""; return; }
    const t = a.totals;

    // Profit card: real profit if cost data exists, else assumed-margin estimate
    let profitCard;
    if (t.hasCost) {
      profitCard =
        card("Total Profit", money(t.profit), "pos") +
        card("Total Cost", money(t.cost));
    } else {
      const est = t.revenue != null ? Math.round(t.revenue * assumedMargin) / 100 : null;
      profitCard =
        '<div class="card assume"><div class="k">Est. Profit</div>' +
        '<div class="row"><span class="v pos" id="estProfit">' + money(est) + '</span></div>' +
        '<div class="row" style="margin-top:10px"><span class="k">Margin</span>' +
        '<input id="marginInput" type="number" min="0" max="100" value="' + assumedMargin + '" />' +
        '<span class="k">%</span></div>' +
        '<div class="hint">No cost column found — estimated from revenue.</div></div>';
    }

    const cards =
      card("Total Revenue", money(t.revenue), "pos") +
      profitCard +
      card("Orders", num(t.orders)) +
      card("Units Sold", num(t.units)) +
      card("Avg Order Value", money(t.avgOrderValue));

    let html =
      "<h2>Analytics</h2>" +
      '<div class="cap">Computed over all ' + num(t.orders) + " rows · sheet: " +
      escapeHtml(currentData.sheets[currentSheetIndex].name) + "</div>" +
      '<div class="cards">' + cards + "</div>";

    // Monthly trend (revenue bars; profit shown when available)
    if (a.monthly && a.monthly.length) {
      const max = Math.max(...a.monthly.map((m) => m.revenue), 1);
      html += '<div class="panel"><h3>Monthly Revenue' + (t.hasCost ? " &amp; Profit" : "") + "</h3>";
      a.monthly.forEach((m) => {
        html += barRow(m.month, m.revenue, max, money(m.revenue));
        if (t.hasCost) html += barRow("", m.profit, max, money(m.profit), true);
      });
      html += "</div>";
    }

    // Category + top products side by side
    let side = "";
    if (a.categories && a.categories.length) {
      const max = Math.max(...a.categories.map((c) => c.revenue), 1);
      let inner = '<div class="panel"><h3>Revenue by Category</h3>';
      a.categories.slice(0, 8).forEach((c) => {
        inner += barRow(c.name, c.revenue, max, money(c.revenue));
      });
      side += inner + "</div>";
    }
    if (a.topProducts && a.topProducts.length) {
      const max = Math.max(...a.topProducts.map((p) => p.revenue), 1);
      let inner = '<div class="panel"><h3>Top Products</h3>';
      a.topProducts.slice(0, 6).forEach((p) => {
        inner += barRow(p.name, p.revenue, max, money(p.revenue));
      });
      side += inner + "</div>";
    }
    if (side) html += '<div class="breakdowns">' + side + "</div>";

    // Status breakdown as chips
    if (a.statuses && a.statuses.length) {
      html += '<div class="panel"><h3>Order Status</h3><div class="status-chips">';
      a.statuses.forEach((s) => {
        html += '<span class="chip">' + escapeHtml(s.name) + " <b>" + num(s.count) + "</b></span>";
      });
      html += "</div></div>";
    }

    analyticsEl.innerHTML = html;

    // Wire the margin input to recompute estimated profit live
    const marginInput = document.getElementById("marginInput");
    if (marginInput) {
      marginInput.addEventListener("input", () => {
        assumedMargin = Math.max(0, Math.min(100, Number(marginInput.value) || 0));
        const est = t.revenue != null ? Math.round(t.revenue * assumedMargin) / 100 : null;
        document.getElementById("estProfit").textContent = money(est);
      });
    }
  }

  function card(k, v, cls) {
    return '<div class="card"><div class="k">' + k + '</div><div class="v ' +
      (cls || "") + '">' + v + "</div></div>";
  }

  function barRow(label, value, max, amountText, amber) {
    const pct = max > 0 && value != null ? Math.max(0, (value / max) * 100) : 0;
    return '<div class="bar-row"><span class="label">' + escapeHtml(String(label)) +
      '</span><div class="bar-track"><div class="bar-fill ' + (amber ? "amber" : "") +
      '" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<span class="amt">' + amountText + "</span></div>";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (m) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])
    );
  }
</script>
</body>
</html>
